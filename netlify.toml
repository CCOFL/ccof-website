# Netlify deploy config for the Next.js (App Router) site.
# The official plugin handles SSR, route handlers, image optimization, and redirects.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Canonicalize the defensive .com domains onto the primary .org.
# Netlify serves domain aliases directly (no automatic cross-domain
# redirect), so these host-based rules do the 301 explicitly.
[[redirects]]
  from = "https://childrenscollectivefl.com/*"
  to = "https://childrenscollectivefl.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.childrenscollectivefl.com/*"
  to = "https://childrenscollectivefl.org/:splat"
  status = 301
  force = true

# Security headers (complements WCAG/best-practices goals).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
